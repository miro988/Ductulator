<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords"
        content="HVAC,duct sizing,duct,HVAC duct,ductulator,online ductulator,how to size ducts,how to size hvac ducts">
    <meta name="author" content="Miro Zaroukian">
    <meta name="description" content="Free online ductulator for sizing of HVAC ducts.">
    <meta name="robots" content="noarchive">
    <title>Ductulator</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:300,400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <script src="myscript.js"></script>
    <link rel="stylesheet" href="style.css" type="text/css" media="all">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJ2X9TRN3H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-HJ2X9TRN3H');
    </script>
</head>

<body>
    <!-- Redirect non-US visitors to metric version -->
    <script>
        var lang = navigator.language || navigator.userLanguage;
        if (!(lang.indexOf('en-US') == 0)) { window.location = '/metric/'; }
    </script>

    <header class="master-header">
        <div class="site-title"><a href=".">Ductulator.com</a> | <a href="/help.html">Help</a></div>
    </header>

    <main id="content" class="main-area">
        <div class="border"></div>
        <div class="L1-1"></div>
        <label class="L1-2" for="CFM">Airflow Rate:</label>
        <div class="L1-3 step-group">
            <input type="number" name="CFM" id="CFM" min="50" max="80000" step="50" value="800" inputmode="decimal"
                oninput="KeyPressed()" onkeydown="DoMath(event)" required autofocus>
            <div class="stepper">
                <button type="button" class="step-btn input-spinner step-btn--up" aria-label="Increase airflow"
                    onclick="stepInput('CFM', 50)">▲</button>
                <button type="button" class="step-btn input-spinner step-btn--down" aria-label="Decrease airflow"
                    onclick="stepInput('CFM', -50)">▼</button>
            </div>
            <span class="unit-label">CFM</span>
        </div>

        <div class="L2-1"></div>
        <label class="L2-2" for="FPM">Maximum Air Velocity:</label>
        <div class="L2-3 step-group">
            <input type="number" name="FPM" id="FPM" min="50" max="3200" step="50" value="800" inputmode="decimal"
                oninput="KeyPressed()" required>
            <div class="stepper">
                <button type="button" class="step-btn input-spinner step-btn--up" aria-label="Increase air velocity"
                    onclick="stepInput('FPM', 50)">▲</button>
                <button type="button" class="step-btn input-spinner step-btn--down" aria-label="Decrease air velocity"
                    onclick="stepInput('FPM', -50)">▼</button>
            </div>
            <span class="unit-label">FPM</span>
        </div>

        <div class="L3-1"></div>
        <label class="L3-2" for="inWg">Max. Static Loss/100ft:</label>
        <div class="L3-3 step-group">
            <input type="number" name="inWg" id="inWg" min="0.06" max="2.0" step="0.02" value="0.08" inputmode="decimal"
                oninput="KeyPressed()" required>
            <div class="stepper">
                <button type="button" class="step-btn input-spinner step-btn--up" aria-label="Increase static loss"
                    onclick="stepInput('inWg', 0.02)">▲</button>
                <button type="button" class="step-btn input-spinner step-btn--down" aria-label="Decrease static loss"
                    onclick="stepInput('inWg', -0.02)">▼</button>
            </div>
            <span class="unit-label">InWg</span>
        </div>

        <div class="result-grid" id="OutputGrid"></div>

    </main>

    <footer class="footer">
        <details class="info-note">
            <summary aria-label="Pressure drop info"><span class="info-icon">i</span></summary>
            <p>Pressure drop calculations are based on Hazen–Williams equation.<br>Air Density=0.0751 lbm/ft3 standard
                air,
                Duct Roughness Factor=0.0003 ft for sheet metal and Air Dynamic Viscocity=0.018 cP.</p>
        </details>
        <a href="https://ductulator.com/metric/" style="color:yellow;">Go to Metric Version</a>
        <p>&copy; 2017-
            <script>document.write(/\d{4}/.exec(Date())[0])</script> Miro Zaroukian. All rights reserved.
        </p>
    </footer>
</body>

</html>
