    <!-- Multi-Lingual-->

    <main id="content" class="main-area">
        <div class="border"></div>
        <div class="L1-1"></div>
        <!-- .Left Bar -->
        <div class="L1-2">Airflow Quantity:</div>
        <!-- .Left Bar -->
        <div class="L1-3">
            <input type="number" title="Enter desired airflow quntity in liters per second" name="CFM" id="CFM" min="20"
                max="50000" step="20" value="350" oninput="KeyPressed()" onkeydown="DoMath(event)" required autofocus
                pattern="\d*">
            <span>L/s</span>
        </div>
        <!-- .Left Bar onclick="this.select();"-->


        <div class="L2-1"></div>
        <!-- .Left Bar -->
        <div class="L2-2">Maximum Air Velocity:</div>
        <!-- .Left Bar -->
        <div class="L2-3">
            <input type="number" name="FPM" title="Enter maximum air velocity in meters per second" min="1.6" max="20"
                step="0.20" value="4" oninput="KeyPressed()" required pattern="\d*">
            <span>m/s</span>
        </div>
        <!-- .Left Bar -->

        <div class="L3-1"></div>
        <!-- .Left Bar onfocus="this.select();"-->
        <div class="L3-2">Max. Static Loss:</div>
        <!-- .Left Bar -->
        <div class="L3-3">

            <!-- <select class="inWg" name="inWg" onchange="KeyPressed()">
                <option value="0.1">0.10</option>
                <option value="0.08">0.08</option>
                <option value="0.06">0.06</option>
                <option value="0.01">0.01</option>
            </select>-->
            <input type="number" name="inWg" title="Enter maximum static loss in pascal per meter" min="0.08" max="20"
                step="0.02" value="0.08" oninput="KeyPressed()" required pattern="\d*" />
            <span>Pa/m</span>
        </div>
        <!-- .Left Bar -->

        <table class="R1-1" id="OutputTable">
            <!--cellspacing="50">-->
            <tbody>
                <tr>
                    <td rowspan="2" id="R1C"></td>
                    <td colspan="5"><small id="HeadText">Round duct (mm):</small></td>
                </tr>
                <tr>
                    <td><input type="number" dir="rtl" name="Ldsize" id=00 min="4" step="10" value="8"
                            oninput="CalcMeRnd()" required>"Ø</td>
                    <td class="Vel" id=01>573</td>
                    <td><small> FPM</small></td>
                    <td class="StLoss" id=02>0.073</td>
                    <td><small>inWg/100ft</small></td>

                </tr>

                <tr>
                    <td rowspan="4" id="R2C"></td>
                    <td colspan="5">
                        <small>Rectangular duct(mm):</small>
                    </td>
                </tr>
                <tr>
                    <td><input type="number" dir="rtl" name="Ldsize" id=10 step="20" min="4" value="8"
                            oninput="CalcMeRec(1)" required>"x
                        <input type="number" name="Rdsize" step="20" min="4" value="8" oninput="CalcMeRec(1)" id=11
                            required><span class="inchSpan">"</span>
                    </td>
                    <td class="Vel" id=12>4500</td>
                    <td><small>FPM</small></td>

                    <td class="StLoss" id=13>0.047 </td>
                    <td><small>inWg/100ft</small></td>

                </tr>

                    <td>10"x6"</td>
